[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "era-ai"
version = "1.0.0"
description = "ERA AI — Emergent Reasoning Architecture & Local Reasoning Router"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["era*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
